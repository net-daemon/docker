#### Publish tags to docker hub
name: 📦 Deploy to netdaemon_addonbase .NET 11
on:
  workflow_dispatch:

jobs:
  deploy:
    name: 📦 Deploy to netdaemon_addonbase .NET 11
    runs-on: ubuntu-latest
    environment: CI - release environment
    steps:
      - name: 📤 Checkout the repository
        uses: actions/checkout@main
      - name: 📎 Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: 🔧 Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
      - name: 🧰 Available platforms
        run: echo ${{ steps.buildx.outputs.platforms }}

      - name: 🔓 Login to Docker hub
        uses: docker/login-action@v1.10.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: 🔓 Login to GitHub Container Registry
        uses: docker/login-action@v1.10.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 🛠️ Run Buildx
        run: |
          docker buildx build \
            --platform linux/arm/v7,linux/arm64,linux/amd64 \
            --output "type=image,push=true" \
            --no-cache \
            --file ./addon_base/Dockerfile11 . \
            --compress \
            --tag "netdaemon/netdaemon_addonbase:11" \
            --tag "ghcr.io/net-daemon/netdaemon_addonbase:11"
